name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  macos:
    name: macOS compilation
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-
      - name: Compile all targets with Clippy
        run: make -j3 clippy

  check:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test --all-targets

      - name: Validate fault suites
        run: |
          for suite in fault/examples/*.yaml; do
            scripts/fault-test.sh suite-validate "$suite"
          done

      - name: Validate protocol contracts and suites
        run: |
          scripts/protocol-test.sh profile-validate smoke protocol/examples/smoke.yaml
          scripts/protocol-test.sh profile-validate full protocol/examples/full-regression.yaml
          scripts/protocol-test.sh profile-validate slow protocol/examples/slow-regression.yaml
          scripts/protocol-test.sh profile-validate external protocol/examples/oidc-keycloak.yaml

      - name: Shell lint test entrypoints
        run: bash -n scripts/fault-test.sh scripts/protocol-test.sh scripts/protocol-compatibility.sh
