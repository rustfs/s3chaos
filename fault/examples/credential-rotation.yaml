apiVersion: rustfs.com/s3chaos/v1alpha1
kind: FaultSuite
metadata:
  name: rustfs-credential-rotation
budgets:
  maxDuration: 1h
  stopOnFirstFailure: true
  continueOnSeverities: []
  maxClientDisruptions: 64
  recoveryStableWindowSeconds: 30
observability:
  chaosDashboard: optional
artifacts:
  required: strict
workloadProfiles:
  rotation:
    objects: 64
    concurrency: 8
scenarios:
  - name: credential-rotation-mid-load
    faultDuration: 5m
    workloadProfile: rotation
