apiVersion: rustfs.com/s3chaos/v1alpha1
kind: FaultSuite
metadata:
  name: ack-put-relaxed-control
budgets:
  stopOnFirstFailure: true
  continueOnSeverities: []
artifacts:
  required: strict
scenarios:
  - name: dm-drop-writes-after-ack-put
    ackCalibration: relaxed
    workload:
      objects: 64
      concurrency: 4
    expectedFailure:
      classification: committed_version_missing
      severity: fail_correctness
      responsibilityDomain: product
      evidenceRefs:
        - checker-pre-recommit-report.json
        - fault-evidence.json
        - run-events.jsonl
