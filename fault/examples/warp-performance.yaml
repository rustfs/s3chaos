# Performance-only Warp campaign. Metrics land in warp-powerloss-metrics.json
# (in-run baseline ops/s, degraded ops/s, drop percent, fault-window error
# percent, node-ready lag NOT_APPLICABLE, and time-to-baseline). Peer A/B
# against MinIO or Pigsty SILO is not part of CI; see
# docs/MAC_MINI_CHAOS_COVERAGE.md.
apiVersion: rustfs.com/s3chaos/v1alpha1
kind: FaultSuite
metadata:
  name: rustfs-fault-warp-performance
budgets:
  maxDuration: 1h
  stopOnFirstFailure: true
  continueOnSeverities: []
  maxClientDisruptions: 1200
  recoveryStableWindowSeconds: 60
observability:
  chaosDashboard: optional
artifacts:
  required: strict
workloadProfiles:
  performance:
    objects: 2400
    concurrency: 60
scenarios:
  - name: warp-under-chaos
    faultDuration: 15m
    percent: 20
    workloadProfile: performance
