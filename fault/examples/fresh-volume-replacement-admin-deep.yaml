apiVersion: rustfs.com/s3chaos/v1alpha1
kind: FaultSuite
metadata:
  name: rustfs-fresh-volume-admin-deep
budgets:
  maxDuration: 1h
  stopOnFirstFailure: true
  continueOnSeverities: []
  maxClientDisruptions: 0
observability:
  chaosDashboard: optional
artifacts:
  required: strict
workloadProfiles:
  recovery:
    objects: 600
    concurrency: 30
scenarios:
  - name: fresh-volume-replacement
    storageRecoveryCase: fresh-volume-replacement-admin-deep
    faultDuration: 30m
    workloadProfile: recovery
