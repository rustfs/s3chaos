apiVersion: rustfs.com/s3chaos/v1alpha1
kind: FaultSuite
metadata:
  name: rustfs-chaos-mesh-regression
budgets:
  maxDuration: 9h
  stopOnFirstFailure: true
  continueOnSeverities: []
  maxClientDisruptions: 9200
  recoveryStableWindowSeconds: 60
observability:
  chaosDashboard: optional
artifacts:
  required: strict
workloadProfiles:
  smoke:
    objects: 600
    concurrency: 30
  regression:
    objects: 2400
    concurrency: 60
  quorum:
    objects: 240
    concurrency: 16
scenarios:
  - name: io-eio
    faultDuration: 8m
    percent: 20
    workloadProfile: smoke
  - name: pod-kill-one
    faultDuration: 8m
    workloadProfile: smoke
  - name: io-read-mistake
    faultDuration: 8m
    percent: 20
    workloadProfile: smoke
  - name: disk-full
    faultDuration: 8m
    percent: 100
    workloadProfile: smoke
  - name: network-delay
    faultDuration: 8m
    workloadProfile: smoke
    params:
      kind: networkDelay
      latency: 200ms
      jitter: 50ms
      correlationPercent: 25
  - name: pod-crash-versioned-hot
    faultDuration: 8m
    workloadProfile: smoke
  - name: io-latency
    faultDuration: 15m
    percent: 20
    workloadProfile: regression
    params:
      kind: ioLatency
      delay: 250ms
      methods:
        - read
        - write
  - name: network-partition-one
    faultDuration: 15m
    workloadProfile: regression
  - name: network-asymmetric-partition
    faultDuration: 15m
    workloadProfile: regression
  - name: network-partition-write-quorum-loss
    faultDuration: 15m
    workloadProfile: regression
  - name: network-loss
    faultDuration: 15m
    workloadProfile: regression
    params:
      kind: networkLoss
      lossPercent: 25
      correlationPercent: 25
  - name: network-flaky
    faultDuration: 15m
    workloadProfile: regression
    params:
      kind: networkFlaky
      lossPercent: 10
      correlationPercent: 90
  - name: network-corrupt
    faultDuration: 15m
    workloadProfile: regression
    params:
      kind: networkCorrupt
      corruptPercent: 5
      correlationPercent: 25
  - name: network-duplicate
    faultDuration: 15m
    workloadProfile: regression
    params:
      kind: networkDuplicate
      duplicatePercent: 10
      correlationPercent: 25
  - name: pod-failure
    faultDuration: 15m
    workloadProfile: regression
  - name: pod-restart-storm
    faultDuration: 15m
    workloadProfile: regression
  - name: io-read-only
    faultDuration: 15m
    percent: 100
    workloadProfile: regression
  - name: io-eio-during-multipart
    faultDuration: 15m
    percent: 20
    workloadProfile: regression
  - name: stress-cpu
    faultDuration: 15m
    workloadProfile: regression
    params:
      kind: stressCpu
      workers: 1
      load: 80
  - name: stress-memory
    faultDuration: 15m
    workloadProfile: regression
    params:
      kind: stressMemory
      workers: 1
      size: 512MiB
  - name: quorum-p-io-fault
    faultDuration: 15m
    workloadProfile: quorum
    params:
      kind: quorumIo
      class: payload
  - name: quorum-p-io-fault
    faultDuration: 15m
    workloadProfile: quorum
    params:
      kind: quorumIo
      class: metadata
  - name: quorum-p-plus-one-io-fault
    faultDuration: 15m
    workloadProfile: quorum
    params:
      kind: quorumIo
      class: payload
  - name: quorum-p-plus-one-io-fault
    faultDuration: 15m
    workloadProfile: quorum
    params:
      kind: quorumIo
      class: metadata
  - name: pod-failure-quorum-edge
    faultDuration: 15m
    workloadProfile: quorum
